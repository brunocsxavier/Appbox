name: CI - core-box

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-e-seguranca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências (App, Testes e Semgrep)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest semgrep

      - name: SAST (Semgrep)
        run: |
          semgrep scan \
            --config p/python \
            --config p/flask \
            --config p/secrets \
            --config p/dockerfile \
            --config .semgrep/ \
            --metrics off \
            --json \
            --output semgrep.json \
            --error

      - name: Upload relatório Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json

      - name: Testes unitários e abuse cases (pytest)
        run: |
          pytest --junitxml=junit.xml

      - name: Upload relatório pytest (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-report
          path: junit.xml

      - name: Build e subir a aplicação
        run: |
          docker compose up -d --build
          sleep 15
          curl -I http://localhost:8000/login

      - name: SCA da imagem (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: core-box:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: DAST (OWASP ZAP baseline)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8000
          fail_action: false
          allow_issue_writing: false

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v

      - name: Empacotar aplicação e gerar SHA-256
        run: |
          mkdir -p dist
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./tests' \
              --exclude='./dist' \
              --exclude='./semgrep.json' \
              --exclude='./junit.xml' \
              -czvf dist/core-box-${{ github.sha }}.tar.gz .
          
          cd dist
          sha256sum core-box-${{ github.sha }}.tar.gz > core-box-${{ github.sha }}.tar.gz.sha256
          cat core-box-${{ github.sha }}.tar.gz.sha256

      - name: Publicar artefato e hash SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: core-box-package-${{ github.sha }}
          path: |
            dist/core-box-${{ github.sha }}.tar.gz
            dist/core-box-${{ github.sha }}.tar.gz.sha256
