name: CI - core-box

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-e-seguranca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ETAPA 1 — Secret Scan
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Preparação do ambiente Python (para Semgrep e pytest)
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências (App, Testes e Semgrep)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest semgrep

      # ETAPA 2 — SAST (Análise Estática com Semgrep)
      - name: SAST (Semgrep)
        run: |
          EXTRA_CONFIG=""
          if [ -d ".semgrep" ] && [ -n "$(ls -A .semgrep)" ]; then
            EXTRA_CONFIG="--config .semgrep/"
          fi

          semgrep scan \
            --config p/python \
            --config p/flask \
            --config p/secrets \
            --config p/dockerfile \
            $EXTRA_CONFIG \
            --metrics off \
            --json-output=semgrep.json \
            --error

      - name: Upload relatório Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json

      # ETAPA 3 — Testes Unitários & Abuse Cases (pytest)
      - name: Testes unitários e abuse cases (pytest)
        run: |
          pytest --junitxml=junit.xml

      - name: Upload relatório pytest (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-report
          path: junit.xml

      # ETAPA 3 (cont.) — Build, SCA e DAST
      - name: Build e subir a aplicação
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

          docker compose up -d --build

          echo "Aguardando aplicação responder na porta 8000..."
          for i in {1..15}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/login | grep -qE "200|302|401|405"; then
              echo "Aplicação online!"
              curl -I http://localhost:8000/login
              exit 0
            fi
            echo "Tentativa $i/15: aguardando 3s..."
            sleep 3
          done

          echo "ERRO: A aplicação não subiu a tempo. Logs do container:"
          docker compose ps
          docker compose logs
          exit 1

      - name: SCA da imagem (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: core-box:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: DAST (OWASP ZAP baseline)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8000
          fail_action: false
          allow_issue_writing: false

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v

      # ETAPA 3 (cont.) — Empacotamento e Hash SHA-256
      - name: Empacotar aplicação e gerar SHA-256
        run: |
          mkdir -p dist
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./tests' \
              --exclude='./dist' \
              --exclude='./semgrep.json' \
              --exclude='./junit.xml' \
              -czvf dist/core-box-${{ github.sha }}.tar.gz .
          
          cd dist
          sha256sum core-box-${{ github.sha }}.tar.gz > core-box-${{ github.sha }}.tar.gz.sha256
          cat core-box-${{ github.sha }}.tar.gz.sha256

      - name: Publicar artefato e hash SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: core-box-package-${{ github.sha }}
          path: |
            dist/core-box-${{ github.sha }}.tar.gz
            dist/core-box-${{ github.sha }}.tar.gz.sha256
