name: CI/CD - core-box (8 Etapas DevSecOps)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==============================================================================
  # ETAPA 1 — Verificação de segredos (Gitleaks)
  # Artefato: relatorio-gitleaks | Política: Bloqueia
  # ==============================================================================
  etapa-01-gitleaks:
    name: 1. Verificação de segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Gitleaks (histórico completo -> JSON)
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source="." --log-opts="--all" \
            --report-format=json --report-path=gitleaks-report.json --exit-code=1

      - name: Publicar artefato relatorio-gitleaks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-gitleaks
          path: gitleaks-report.json

      - name: Aplicar gate de bloqueio
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1

  # ==============================================================================
  # ETAPA 2 — Análise estática SAST (Semgrep)
  # Artefato: relatorio-semgrep | Política: Bloqueia (ERROR) / WARNING triados
  # ==============================================================================
  etapa-02-semgrep:
    name: 2. Análise estática SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: etapa-01-gitleaks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python e instalar Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Semgrep SAST
        id: semgrep
        continue-on-error: true
        run: |
          pip install semgrep
          EXTRA_CONFIG=""
          if [ -d ".semgrep" ] && [ -n "$(ls -A .semgrep)" ]; then
            EXTRA_CONFIG="--config .semgrep/"
          fi

          # Roda todas as regras para gerar o JSON completo (incluindo WARNING)
          semgrep scan \
            --config p/python \
            --config p/flask \
            --config p/secrets \
            --config p/dockerfile \
            $EXTRA_CONFIG \
            --metrics off \
            --json-output=semgrep-report.json

          # Bloqueia apenas se houver achados de severidade ERROR
          python3 -c '
          import json, sys
          with open("semgrep-report.json") as f:
              data = json.load(f)
          errors = [r for r in data.get("results", []) if r.get("extra", {}).get("severity") == "ERROR"]
          warnings = [r for r in data.get("results", []) if r.get("extra", {}).get("severity") == "WARNING"]
          print(f"Total ERROR: {len(errors)} | Total WARNING (triados): {len(warnings)}")
          if errors:
              sys.exit(1)
          '

      - name: Publicar artefato relatorio-semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-semgrep
          path: semgrep-report.json

      - name: Aplicar gate de bloqueio (ERROR)
        if: steps.semgrep.outcome == 'failure'
        run: exit 1

  # ==============================================================================
  # ETAPA 3 — Build, dependências e artefato (pip + pytest)
  # Artefato: relatorio-03-build | Política: Bloqueia (build/testes)
  # ==============================================================================
  etapa-03-build-pytest:
    name: 3. Build, dependências e artefato (pytest)
    runs-on: ubuntu-latest
    needs: etapa-02-semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Executar testes (JUnit XML)
        id: pytest
        continue-on-error: true
        run: |
          pytest --junitxml=junit.xml

      - name: Empacotar aplicação com SHA-256
        if: steps.pytest.outcome == 'success'
        run: |
          mkdir -p dist
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./tests' \
              --exclude='./dist' \
              --exclude='./junit.xml' \
              -czvf dist/core-box-sha-${SHORT_SHA}.tar.gz .
          cd dist
          sha256sum core-box-sha-${SHORT_SHA}.tar.gz > core-box-sha-${SHORT_SHA}.tar.gz.sha256

      - name: Publicar artefato relatorio-03-build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-03-build
          path: |
            junit.xml
            dist/

      - name: Aplicar gate de bloqueio
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  # ==============================================================================
  # ETAPA 4 — SCA de dependências (Trivy fs + SBOM CycloneDX)
  # Artefato: relatorio-04-trivy-sca | Política: Bloqueia HIGH/CRITICAL
  # ==============================================================================
  etapa-04-trivy-sca:
    name: 4. SCA de dependências (Trivy fs)
    runs-on: ubuntu-latest
    needs: etapa-03-build-pytest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar relatório completo SCA e SBOM CycloneDX
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-sca-completo.json'

      - name: Gerar SBOM CycloneDX
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Gate SCA (HIGH/CRITICAL com correção)
        id: trivy_fs_gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Publicar artefato relatorio-04-trivy-sca
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-04-trivy-sca
          path: |
            trivy-sca-completo.json
            sbom-cyclonedx.json

      - name: Aplicar gate de bloqueio
        if: steps.trivy_fs_gate.outcome == 'failure'
        run: exit 1

  # ==============================================================================
  # ETAPA 5 — Docker build + push (Docker Buildx + GHCR)
  # Artefato: docker-build | Política: Bloqueia (falha de build)
  # ==============================================================================
  etapa-05-docker-build:
    name: 5. Docker build + push (GHCR)
    runs-on: ubuntu-latest
    needs: etapa-04-trivy-sca
    outputs:
      image_digest: ${{ steps.build_push.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.short_sha }}
      full_image_ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir tag sha-xxxxxxx e baixar nome da imagem
        id: meta
        run: |
          SHORT_SHA="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push para GHCR
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Salvar metadados do build e digest
        run: |
          cat <<EOF > docker-build-metadata.json
          {
            "image": "${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}",
            "tag": "${{ steps.meta.outputs.short_sha }}",
            "digest": "${{ steps.build_push.outputs.digest }}",
            "ref": "${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}@${{ steps.build_push.outputs.digest }}"
          }
          EOF
          cat docker-build-metadata.json

      - name: Publicar artefato docker-build
        uses: actions/upload-artifact@v4
        with:
          name: docker-build
          path: docker-build-metadata.json

  # ==============================================================================
  # ETAPA 6 — Scan da imagem (Trivy image pelo digest da etapa 5)
  # Artefato: trivy-image | Política: Bloqueia HIGH/CRITICAL
  # ==============================================================================
  etapa-06-trivy-image:
    name: 6. Scan da imagem (Trivy image)
    runs-on: ubuntu-latest
    needs: etapa-05-docker-build
    steps:
      - name: Login no GHCR
