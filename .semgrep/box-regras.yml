rules:
  - id: box-tm03-conta-origem-vinda-do-cliente
    languages:
      - python
    severity: ERROR
    message: >-
      TM-03 (BOLA / CWE-639) - a conta de origem nao pode
      ser utilizada diretamente a partir da requisicao do cliente.
    metadata:
      threat_model: TM-03
      cwe: "CWE-639"
      owasp: "API1:2023"
    pattern-either:
      - pattern: request.form.get("conta_origem", ...)
      - pattern: request.form["conta_origem"]
      - pattern: request.args.get("conta_origem", ...)
      - pattern: request.args["conta_origem"]
      - pattern: request.get_json(...).get("conta_origem", ...)
      - pattern: request.get_json(...)["conta_origem"]

  - id: box-tm04-limite-override-cliente
    languages:
      - python
    severity: ERROR
    message: >-
      TM-04 (Manipulacao de Limite) - limite_override nao
      pode ser aceito da requisicao do cliente.
    metadata:
      threat_model: TM-04
      cwe: "CWE-284"
      owasp: "API5:2023"
    pattern-either:
      - pattern: $DADOS.get("limite_override", ...)
      - pattern: $DADOS["limite_override"]

  - id: box-tm06-log-expondo-token-ou-authorization
    languages:
      - python
    severity: ERROR
    message: >-
      TM-06 (Exposicao de Dados Sensiveis em Log) - tokens
      e o cabecalho Authorization nao devem ser registrados.
    metadata:
      threat_model: TM-06
      cwe: "CWE-532"
      owasp: "API3:2023"
    pattern-either:
      - pattern: $LOGGER.$LEVEL(..., request.headers.get("Authorization", ...), ...)
      - pattern: $LOGGER.$LEVEL(..., request.headers["Authorization"], ...)
      - pattern: $LOGGER.$LEVEL(..., request.cookies.get("box_token", ...), ...)
      - pattern: print(..., request.headers.get("Authorization", ...), ...)
      - pattern: print(..., request.cookies.get("box_token", ...), ...)
